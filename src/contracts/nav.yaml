kind: nav
description: A vertical menu; the first item is current.
anchors:
  - item
props:
  items:
    type: list
    description: item labels, or { group, items } for a heading over its items; a nav with children instead lists them as elements
  active:
    type: string
  logo:
    type: string
    description: a word mark at the top of the menu
tokens:
  bg: color.surface
  text: color.text
  muted: color.muted
  radius: radius.sm
sample:
  items:
    - Orders
    - Items
    - Settings
