kind: field
description: A label and a control. control is an element (input, select…); error and caption are lines around it.
props:
  label:
    type: string
    required: true
  control:
    type: element
  caption:
    type: string
  error:
    type: string
  reveals:
    type: any
  tooltip:
    type: any
    description: items shown on a ⓘ after the label
  preview:
    type: element
    description: what the control shows after a choice — a thumbnail, a summary
  required:
    type: boolean
    default: false
    description: a * after the label
  labels:
    type: enum
    options: [left, top]
    default: left
    description: "left: label beside the control (two columns); top: label over it, caption under it — an admin form"
tokens:
  text: color.text
  muted: color.muted
  accent: color.danger
sample:
  label: Email
  control:
    kind: input
    placeholder: you@example.com
